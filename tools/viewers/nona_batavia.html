<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nona Batavia + PS2 Twintail Hair (.GLB Viewer)</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0f1217;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #header {
      position: absolute;
      top: 16px;
      left: 20px;
      z-index: 10;
      background: rgba(18, 24, 32, 0.90);
      backdrop-filter: blur(8px);
      padding: 14px 20px;
      border-radius: 8px;
      border: 1px solid #2e3b48;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 19px;
      color: #ffd15c;
      letter-spacing: 0.5px;
    }
    p {
      margin: 0;
      font-size: 13px;
      color: #8c9ba8;
    }
    #view-controls {
      position: absolute;
      top: 16px;
      right: 20px;
      z-index: 10;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 16px;
      background: rgba(28, 36, 48, 0.9);
      border: 1px solid #3d4f63;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.15s ease;
    }
    button:hover {
      background: #3182ce;
      border-color: #63b3ed;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #ffd15c;
      background: rgba(0,0,0,0.85);
      padding: 16px 28px;
      border-radius: 8px;
      pointer-events: none;
      z-index: 100;
    }
    #stats-badge {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: rgba(18, 24, 32, 0.85);
      padding: 8px 14px;
      border-radius: 6px;
      border: 1px solid #2e3b48;
      font-size: 12px;
      font-family: monospace;
      color: #98c379;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
  <div id="header">
    <h1>NONA BATAVIA + PS2 TWINTAIL HAIR</h1>
    <p>Orbit: Klik Kiri + Geser | Zoom: Scroll Wheel | Pan: Klik Kanan + Geser</p>
  </div>
  <div id="loading">Memuat Nona Batavia (.glb)...</div>

  <div id="view-controls">
    <button id="btn-head">Fokus Kepala & Twintail</button>
    <button id="btn-body">Fokus Seluruh Tubuh</button>
  </div>

  <div id="stats-badge">Mesh: Body + PS2 Twintail Hair | Vertices: 7,140</div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x13171f);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.05, 100);
    camera.position.set(0, 1.62, 1.15); // Focused on head

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 1.56, 0);

    const hemiLight = new THREE.HemisphereLight(0xfff6ea, 0x334455, 1.4);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.6);
    dirLight.position.set(3, 6, 4);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const backLight = new THREE.DirectionalLight(0xffb870, 0.9);
    backLight.position.set(-3, 3, -3);
    scene.add(backLight);

    const fillLight = new THREE.PointLight(0xffffff, 0.6, 5);
    fillLight.position.set(0, 1.6, 1.5);
    scene.add(fillLight);

    const grid = new THREE.GridHelper(10, 20, 0x3d4b5c, 0x212a35);
    grid.position.y = 0;
    scene.add(grid);

    let characterModel = null;
    const loader = new THREE.GLTFLoader();

    function setupModel(gltf) {
      document.getElementById('loading').style.display = 'none';
      characterModel = gltf.scene;

      characterModel.traverse((child) => {
        if (child.isMesh) {
          child.castShadow = true;
          child.receiveShadow = true;
          if (child.material) {
            child.material.roughness = 0.82;
            child.material.metalness = 0.06;
          }
        }
      });

      scene.add(characterModel);
      console.log('Character model with twintail hair loaded successfully!');
    }

    loader.load('/models/nona_batavia.glb?v=' + Date.now(), setupModel, undefined, (err) => {
      console.warn('Fallback load:', err);
      loader.load('/models/nona_batavia.glb', setupModel);
    });

    document.getElementById('btn-head').addEventListener('click', () => {
      controls.target.set(0, 1.56, 0);
      camera.position.set(0, 1.62, 1.10);
    });

    document.getElementById('btn-body').addEventListener('click', () => {
      controls.target.set(0, 0.95, 0);
      camera.position.set(0, 1.30, 3.4);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
